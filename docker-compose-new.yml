version: '3.9'

services:
  neo4j:
    image: neo4j:5
    container_name: neo4j
    ports:
      - "7474:7474"  # Neo4j browser
      - "7687:7687"  # Bolt protocol
    environment:
      NEO4J_AUTH: "neo4j/password"
    volumes:
      - neo4j_data:/data

  flask_app:
    build: .
    container_name: flask_app
    ports:
      - "5000:5000"
    depends_on:
      - neo4j
    environment:
      FLASK_APP: "app.py"
      FLASK_ENV: "development"
      FLASK_DEBUG: "1"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "password"
    volumes:
      - .:/app                # Mount entire project for live editing
      - ./uploads:/app/uploads  # Keep uploads persistent

volumes:
  neo4j_data:

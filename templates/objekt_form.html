<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Objekt Informationen Eingabeformular</title>
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #fafafa;
    padding: 40px;
}
h2 { color: #222; }

table.property-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    background-color: #fff;
}
table.property-table th, table.property-table td {
    border: 1px solid #ccc;
    padding: 8px 12px;
    vertical-align: middle;
}
table.property-table th {
    background-color: #f0f0f0;
}
.col1 { width: 30%; background-color: #f9f9f9; font-weight: bold; }
.col2 { position: relative; }

.col2 input[type="text"], .col2 textarea {
    width: 80%;
    padding: 6px;
    font-size: 14px;
    border: 1px solid #bbb;
    border-radius: 4px;
    resize: vertical;
}

/* Traffic light container */
.traffic-light-container {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-left: 10px;
}
.light {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background-color: #ccc;
    border: 1px solid #999;
    cursor: pointer;
    transition: background-color 0.2s;
}
.light.red.active { background-color: red; }
.light.yellow.active { background-color: #FFD700; }
.light.green.active { background-color: #4CAF50; }

.submit-btn, .add-row-btn {
    margin-top: 20px;
    padding: 10px 18px;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
}
.submit-btn { background-color: #4CAF50; color: white; }
.add-row-btn { background-color: #2196F3; color: white; margin-right: 10px; }
</style>
</head>
<body>

<h2>Objekt Informationen</h2>

<form method="POST" action="{{ url_for('submit') }}">
<table class="property-table" id="propertyTable">
<thead><tr><th>Property</th><th>Value</th></tr></thead>
<tbody>
{% for field in fields %}
{% set val = data.get(field, '') %}
<tr>
<td class="col1">{{ field }}</td>
<td class="col2">
    {% if "Beschreibung" in field or "Objekt-" in field or "Narrativ" in field or "Kommentar" in field %}
        <textarea name="{{ field }}" rows="3"
                  oninput="setYellow(this)">{{ val }}</textarea>
    {% else %}
        <input type="text" name="{{ field }}" value="{{ val }}"
               oninput="setYellow(this)">
    {% endif %}

    <!-- Traffic light widget -->
    <div class="traffic-light-container">
        <div class="light red active" onclick="setLight(this, 'red')"></div>
        <div class="light yellow" onclick="setLight(this, 'yellow')"></div>
        <div class="light green" onclick="setLight(this, 'green')"></div>
    </div>
</td>
</tr>
{% endfor %}
</tbody>
</table>

<button type="button" class="add-row-btn" onclick="addRow()">+ Neue Zeile hinzufügen</button>
<button type="submit" class="submit-btn">Daten speichern</button>
</form>

<script>
let rowCount = {{ fields|length }};

// Add new row dynamically
function addRow() {
    const tableBody = document.querySelector("#propertyTable tbody");
    const newRow = document.createElement("tr");
    const propertyCell = document.createElement("td");
    const valueCell = document.createElement("td");
    propertyCell.classList.add("col1");
    valueCell.classList.add("col2");

    const propertyInput = document.createElement("input");
    propertyInput.type = "text";
    propertyInput.name = "custom_property_" + rowCount;
    propertyInput.placeholder = "Neues Feld eingeben...";
    propertyInput.oninput = () => setYellow(propertyInput);

    const valueInput = document.createElement("input");
    valueInput.type = "text";
    valueInput.name = "custom_value_" + rowCount;
    valueInput.placeholder = "Wert eingeben...";
    valueInput.oninput = () => setYellow(valueInput);

    const trafficLight = document.createElement("div");
    trafficLight.classList.add("traffic-light-container");
    ["red", "yellow", "green"].forEach(color => {
        const div = document.createElement("div");
        div.classList.add("light", color);
        if (color === "red") div.classList.add("active");
        div.onclick = () => setLight(div, color);
        trafficLight.appendChild(div);
    });

    propertyCell.appendChild(propertyInput);
    valueCell.appendChild(valueInput);
    valueCell.appendChild(trafficLight);

    newRow.appendChild(propertyCell);
    newRow.appendChild(valueCell);
    tableBody.appendChild(newRow);
    rowCount++;
}

// Automatically set yellow when text is added
function setYellow(element) {
    const lights = element.parentElement.querySelectorAll(".light");
    if (!lights.length) return;
    lights.forEach(l => l.classList.remove("active"));
    const yellow = element.parentElement.querySelector(".light.yellow");
    const red = element.parentElement.querySelector(".light.red");
    if (element.value.trim() === "") {
        red.classList.add("active");
    } else {
        yellow.classList.add("active");
    }
}

// Manually set light by clicking
function setLight(el, color) {
    const container = el.parentElement;
    const lights = container.querySelectorAll(".light");
    lights.forEach(l => l.classList.remove("active"));
    el.classList.add("active");
}

// Initialize all to red
window.onload = function() {
    document.querySelectorAll(".traffic-light-container").forEach(container => {
        const red = container.querySelector(".light.red");
        if (red) red.classList.add("active");
    });
};
</script>

</body>
</html>

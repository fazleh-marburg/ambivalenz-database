<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Objekt Informationen Eingabeformular</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fafafa;
            padding: 40px;
        }
        h2 {
            color: #222;
        }
        table.property-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background-color: #fff;
        }
        table.property-table th, table.property-table td {
            border: 1px solid #ccc;
            padding: 8px 12px;
            vertical-align: middle;
        }
        table.property-table th {
            background-color: #f0f0f0;
            color: #333;
            text-align: left;
        }
        .col1 {
            width: 30%;
            background-color: #f9f9f9;
            font-weight: bold;
        }
        .col2 {
            position: relative;
        }
        .col2 input[type="text"], .col2 textarea {
            width: 95%;
            padding: 6px 28px 6px 6px; /* space for traffic light */
            font-size: 14px;
            border: 1px solid #bbb;
            border-radius: 4px;
            resize: vertical;
        }
        .traffic-light {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background-color: red;
            display: inline-block;
        }
        .traffic-light.green {
            background-color: #4CAF50;
        }
        .submit-btn, .add-row-btn, .upload-btn {
            margin-top: 20px;
            padding: 10px 18px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        .submit-btn {
            background-color: #4CAF50;
            color: white;
        }
        .submit-btn:hover { background-color: #45a049; }
        .add-row-btn {
            background-color: #2196F3;
            color: white;
            margin-right: 10px;
        }
        .add-row-btn:hover { background-color: #1976D2; }
        .upload-btn {
            background-color: #FF9800;
            color: white;
            margin-right: 10px;
        }
        .upload-btn:hover { background-color: #F57C00; }
    </style>
</head>
<body>

    <h2>Objekt Informationen</h2>

    <!-- Excel Upload Form -->
    <form method="POST" action="{{ url_for('upload') }}" enctype="multipart/form-data">
        <label for="file"><strong>Excel-Datei hochladen (.xlsx):</strong></label>
        <input type="file" id="file" name="file" accept=".xlsx" required>
        <button type="submit" class="upload-btn">Excel importieren</button>
    </form>

    <hr>

    <!-- Main Data Entry Form -->
    <form method="POST" action="{{ url_for('submit') }}">
        <table class="property-table" id="propertyTable">
            <thead>
                <tr><th>Property</th><th>Value</th></tr>
            </thead>
            <tbody>
                {% for field in fields %}
                {% set val = data.get(field, '') %}
                <tr>
                    <td class="col1">{{ field }}</td>
                    <td class="col2">
                        {% if "Beschreibung" in field or "Objekt-" in field or "Narrativ" in field or "Kommentar" in field %}
                            <textarea name="{{ field }}" rows="3" oninput="updateLight(this)">{{ val }}</textarea>
                        {% else %}
                            <input type="text" name="{{ field }}" value="{{ val }}" oninput="updateLight(this)">
                        {% endif %}
                        <span class="traffic-light {% if val %}green{% endif %}"></span>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <button type="button" class="add-row-btn" onclick="addRow()">+ Neue Zeile hinzufügen</button>
        <button type="submit" class="submit-btn">Daten speichern</button>
    </form>

    <script>
        let rowCount = {{ fields|length }};

        function addRow() {
            const tableBody = document.querySelector("#propertyTable tbody");
            const newRow = document.createElement("tr");
            const propertyCell = document.createElement("td");
            const valueCell = document.createElement("td");
            propertyCell.classList.add("col1");
            valueCell.classList.add("col2");

            const propertyInput = document.createElement("input");
            propertyInput.type = "text";
            propertyInput.name = "custom_property_" + rowCount;
            propertyInput.placeholder = "Neues Feld eingeben...";
            propertyInput.oninput = () => updateLight(propertyInput);

            const valueInput = document.createElement("input");
            valueInput.type = "text";
            valueInput.name = "custom_value_" + rowCount;
            valueInput.placeholder = "Wert eingeben...";
            valueInput.oninput = () => updateLight(valueInput);

            const light = document.createElement("span");
            light.classList.add("traffic-light");

            propertyCell.appendChild(propertyInput);
            valueCell.appendChild(valueInput);
            valueCell.appendChild(light);
            newRow.appendChild(propertyCell);
            newRow.appendChild(valueCell);
            tableBody.appendChild(newRow);

            rowCount++;
        }

        // Function to toggle traffic light color
        function updateLight(element) {
            const light = element.parentElement.querySelector(".traffic-light");
            if (element.value.trim() === "") {
                light.classList.remove("green");
            } else {
                light.classList.add("green");
            }
        }

        // Initialize on page load
        window.onload = function() {
            document.querySelectorAll(".col2 input, .col2 textarea").forEach(el => {
                updateLight(el);
            });
        };
    </script>

</body>
</html>
